<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="100" fill="url(#grad)"/>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#534AB7"/>
      <stop offset="100%" style="stop-color:#3C3489"/>
    </linearGradient>
  </defs>
  <!-- Comet tail -->
  <ellipse cx="180" cy="340" rx="12" ry="60" fill="rgba(255,255,255,0.2)" transform="rotate(-45 180 340)"/>
  <ellipse cx="200" cy="320" rx="8" ry="45" fill="rgba(255,255,255,0.15)" transform="rotate(-45 200 320)"/>
  <!-- Comet body -->
  <circle cx="290" cy="220" r="65" fill="white" opacity="0.95"/>
  <circle cx="290" cy="220" r="50" fill="#EF9F27"/>
  <circle cx="290" cy="220" r="30" fill="white"/>
  <!-- Stars -->
  <circle cx="160" cy="160" r="6" fill="white" opacity="0.6"/>
  <circle cx="380" cy="300" r="4" fill="white" opacity="0.4"/>
  <circle cx="140" cy="280" r="5" fill="white" opacity="0.5"/>
  <circle cx="350" cy="140" r="7" fill="white" opacity="0.5"/>
</svg>
